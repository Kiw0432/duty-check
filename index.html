<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ระบบเช็คชื่อเวรประจำวัน</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root{
  --c1:#FAF7F3;
  --c2:#F0E4D3;
  --c3:#DCC5B2;
  --c4:#D9A299;
  --text:#5c4d45;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Mitr',sans-serif;
}

body{
  background:var(--c1);
  padding:14px;
  color:var(--text);
}

.container{
  max-width:700px;
  margin:auto;
}

.hidden{
  display:none;
}

.card{
  background:white;
  border-radius:24px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 6px 18px rgba(0,0,0,0.05);
}

.header{
  background:linear-gradient(135deg,var(--c3),var(--c4));
  color:white;
  padding:24px;
  border-radius:24px;
  margin-bottom:16px;
}

.header h1{
  font-size:1.7rem;
}

.label{
  margin-bottom:8px;
  font-size:0.92rem;
}

input,
select{
  width:100%;
  border:none;
  background:var(--c1);
  padding:12px;
  border-radius:14px;
  margin-bottom:12px;
  outline:none;
}

.student-box{
  background:var(--c1);
  border-radius:18px;
  padding:18px;
  text-align:center;
  margin-bottom:16px;
}

.student-name{
  font-size:1.4rem;
  font-weight:600;
}

.student-number,
.student-id{
  color:#8d776a;
  font-size:0.92rem;
}

.switch-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid #eee;
}

.switch{
  width:60px;
  height:34px;
  border-radius:999px;
  background:#d7d7d7;
  position:relative;
  cursor:pointer;
}

.switch::after{
  content:'';
  width:26px;
  height:26px;
  background:white;
  border-radius:50%;
  position:absolute;
  top:4px;
  left:4px;
  transition:0.25s;
}

.switch.active{
  background:var(--c4);
}

.switch.active::after{
  left:30px;
}

.button-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:16px;
}

button{
  border:none;
  border-radius:14px;
  padding:12px;
  cursor:pointer;
  font-size:0.92rem;
}

.btn-main{
  background:var(--c4);
  color:white;
}

.btn-soft{
  background:var(--c2);
}

.btn-save{
  width:100%;
  margin-top:12px;
  background:#89b89a;
  color:white;
}

.dashboard{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:16px;
}

.dash-card{
  background:var(--c1);
  padding:14px;
  border-radius:16px;
  text-align:center;
}

.dash-card h2{
  color:var(--c4);
}

.small-btn{
  padding:8px 12px;
  font-size:0.82rem;
}

.table-wrapper{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:12px;
}

thead{
  background:var(--c2);
}

th,td{
  padding:10px;
  text-align:center;
  font-size:0.88rem;
}

tbody tr{
  border-bottom:1px solid #eee;
}

.footer{
  text-align:center;
  margin-top:12px;
  color:#8b776b;
  font-size:0.85rem;
}

</style>

</head>

<body>

<div class="container">

<div class="header">
<h1>📚 ระบบเช็คชื่อเวร</h1>
<p>Student Care Style 🌷</p>
</div>

<!-- LOGIN -->

<div class="card">

<h2 style="margin-bottom:14px;">
🔐 เข้าสู่ระบบ
</h2>

<input
type="text"
id="username"
placeholder="ชื่อผู้ใช้"
>

<input
type="password"
id="password"
placeholder="รหัสผ่าน"
>

<div class="button-grid">

<button
class="btn-main"
onclick="loginTeacher()"
>
เข้าสู่ระบบครู
</button>

<button
class="btn-soft"
onclick="loginStudent()"
>
นักเรียนเข้าชม
</button>

</div>

<div
id="loginStatus"
style="margin-top:12px;"
></div>

</div>

<!-- MAIN -->

<div id="mainSystem" class="hidden">

<div class="card">

<div class="label">
🔍 ค้นหาชื่อนักเรียน
</div>

<input
type="text"
id="searchInput"
placeholder="ค้นหาชื่อ..."
onkeyup="searchStudent()"
>

<div class="label">
👨‍🎓 เลือกนักเรียน
</div>

<select
id="studentSelect"
onchange="changeStudent()"
></select>

<div class="student-box">

<div
class="student-number"
id="studentNo"
>
เลขที่ -
</div>

<div
class="student-id"
id="studentId"
>
รหัส -
</div>

<div
class="student-name"
id="studentName"
>
กำลังโหลด...
</div>

</div>

<div class="switch-row">

<div>🙋 เช็คชื่อแล้ว</div>

<div
class="switch"
id="checkSwitch"
onclick="toggleCheck()"
></div>

</div>

<div class="switch-row">

<div>🧹 ทำเวรแล้ว</div>

<div
class="switch"
id="doneSwitch"
onclick="toggleDone()"
></div>

</div>

<div class="button-grid">

<button
class="btn-soft"
onclick="prevStudent()"
>
⬅️ ก่อนหน้า
</button>

<button
class="btn-main"
onclick="nextStudent()"
>
ถัดไป ➡️
</button>

</div>

<button
id="saveBtn"
class="btn-save"
onclick="saveData()"
>
💾 บันทึกข้อมูล
</button>

<div class="dashboard">

<div class="dash-card">
<div>ทั้งหมด</div>
<h2 id="allStudentCount">0</h2>
</div>

<div class="dash-card">
<div>มาเรียน</div>
<h2 id="checkedCount">0</h2>
</div>

<div class="dash-card">
<div>ทำเวร</div>
<h2 id="doneCount">0</h2>
</div>

<div class="dash-card">
<div>ขาด</div>
<h2 id="absentCount">0</h2>
</div>

</div>

</div>

<!-- CHART -->

<div class="card">

<div
style="
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px;
"
>

<h2>📊 สรุปรายเดือน</h2>

<button
class="btn-soft small-btn"
onclick="renderMonthlyChart()"
>
รีเฟรช
</button>

</div>

<canvas id="monthlyChart"></canvas>

</div>

<!-- HISTORY -->

<div class="card">

<div
style="
display:flex;
justify-content:space-between;
align-items:center;
"
>

<h2>🕒 ประวัติย้อนหลัง</h2>

<select
id="monthFilter"
style="
width:140px;
margin:0;
"
onchange="renderHistory()"
>
<option value="all">
ทั้งหมด
</option>
</select>

</div>

<div class="table-wrapper">

<table>

<thead>

<tr>
<th>วันที่</th>
<th>เลขที่</th>
<th>ชื่อ</th>
<th>เช็คชื่อ</th>
<th>เวร</th>
</tr>

</thead>

<tbody id="historyTable">

<tr>
<td colspan="5">
ยังไม่มีข้อมูล
</td>
</tr>

</tbody>

</table>

</div>

</div>

<div class="footer">
ระบบเช็คชื่อเวรประจำวัน ✨
</div>

</div>

</div>

<script>

const TEACHER_USER = "teacher";
const TEACHER_PASS = "1234";

function loginTeacher() {

  const user =
    document.getElementById("username").value;

  const pass =
    document.getElementById("password").value;

  if (
    user === TEACHER_USER &&
    pass === TEACHER_PASS
  ) {

    alert("เข้าสู่ระบบสำเร็จ");

  } else {

    alert("ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง");

  }

}

function loginStudent() {

  alert("เข้าสู่โหมดนักเรียน");

}

</script>

</body>
</html>
