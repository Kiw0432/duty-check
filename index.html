<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Duty Check</title>

<style>

body{
font-family:sans-serif;
padding:30px;
background:#FAF7F3;
}

.card{
max-width:400px;
margin:auto;
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

input{
width:100%;
padding:12px;
margin-bottom:10px;
border:none;
background:#F0E4D3;
border-radius:10px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
margin-top:10px;
}

.main{
background:#D9A299;
color:white;
}

.soft{
background:#F0E4D3;
}

</style>

</head>

<body>

<div class="card">

<h2>🔐 เข้าสู่ระบบ</h2>

<input
type="text"
id="username"
placeholder="Username"
>

<input
type="password"
id="password"
placeholder="Password"
>

<button
class="main"
onclick="loginTeacher()"
>
เข้าสู่ระบบครู
</button>

<button
class="soft"
onclick="loginStudent()"
>
นักเรียนเข้าชม
</button>

</div>

<script>

const TEACHER_USER = "teacher";
const TEACHER_PASS = "1234";

function loginTeacher(){

const user =
document.getElementById("username").value;

const pass =
document.getElementById("password").value;

if(
user === TEACHER_USER &&
pass === TEACHER_PASS
){

alert("เข้าสู่ระบบสำเร็จ");

}else{

alert("ชื่อผู้ใช้หรือรหัสผ่านผิด");

}

}

function loginStudent(){

alert("เข้าสู่โหมดนักเรียน");

}

</script>

</body>
</html>
