<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ระบบเช็คชื่อเวร</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root{
--c1:#FAF7F3;
--c2:#F0E4D3;
--c3:#DCC5B2;
--c4:#D9A299;
--text:#5c4d45;
--green:#89b89a;
--red:#e58d8d;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Mitr',sans-serif;
}

body{
background:var(--c1);
color:var(--text);
overflow-x:hidden;
}

/* พื้นหลัง */

#bgPreview{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
opacity:.18;
display:none;
}

.bg-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(255,255,255,.65);
z-index:-1;
}

/* container */

.container{
max-width:1200px;
margin:auto;
padding:20px;
padding-bottom:120px;
}

/* header */

.header{
background:linear-gradient(
135deg,
var(--c3),
var(--c4)
);
padding:28px;
border-radius:30px;
display:flex;
justify-content:space-between;
align-items:flex-start;
margin-bottom:18px;
color:white;
box-shadow:0 8px 20px rgba(0,0,0,.08);
animation:fadeUp .4s ease;
}

.logo h1{
font-size:2rem;
}

.logo p{
font-size:1.1rem;
margin-top:6px;
}

.top-actions{
display:flex;
gap:12px;
}

.top-actions button{
border:none;
padding:14px 22px;
border-radius:18px;
cursor:pointer;
font-size:1rem;
font-weight:600;
box-shadow:0 8px 18px rgba(0,0,0,.08);
}

.setting-btn{
background:#b89c82;
color:white;
}

.logout-btn{
background:#de7f7f;
color:white;
}

/* slider */

.banner-slider{
width:100%;
height:520px;
border-radius:35px;
overflow:hidden;
position:relative;
box-shadow:0 10px 25px rgba(0,0,0,.08);
margin-bottom:30px;
animation:fadeUp .5s ease;
}

.slides{
width:100%;
height:100%;
position:relative;
}

.slide{
position:absolute;
width:100%;
height:100%;
opacity:0;
transition:1s;
}

.slide.active{
opacity:1;
}

.slide img{
width:100%;
height:100%;
object-fit:cover;
transition:transform 8s ease;
}

.slide.active img{
transform:scale(1.05);
}

.dots{
position:absolute;
bottom:16px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:8px;
z-index:5;
}

.dot{
width:12px;
height:12px;
border-radius:50%;
background:rgba(255,255,255,.5);
cursor:pointer;
}

.dot.active{
background:white;
}

/* card */

.card{
background:white;
border-radius:24px;
padding:20px;
margin-bottom:18px;
box-shadow:0 6px 18px rgba(0,0,0,.05);
animation:fadeUp .4s ease;
}

.login-card{
max-width:420px;
margin:40px auto;
padding:30px;
border-radius:34px;
}

input{
width:100%;
border:none;
background:var(--c1);
padding:14px;
border-radius:16px;
outline:none;
margin-bottom:14px;
font-size:1rem;
}

button{
border:none;
border-radius:16px;
padding:14px;
cursor:pointer;
font-size:1rem;
transition:.25s;
}

button:hover{
transform:translateY(-2px);
}

.btn-main{
background:var(--c4);
color:white;
}

.btn-soft{
background:var(--c2);
color:var(--text);
}

.btn-danger{
background:var(--red);
color:white;
}

/* table */

.table-wrapper{
overflow:auto;
border-radius:18px;
}

table{
width:100%;
border-collapse:collapse;
min-width:700px;
}

thead{
background:var(--c2);
}

th,td{
padding:14px;
text-align:center;
border-bottom:1px solid #eee;
}

.active-btn{
background:var(--green)!important;
color:white;
}

/* dashboard */

.dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:14px;
}

.dash-card{
background:var(--c1);
padding:18px;
border-radius:20px;
text-align:center;
}

.dash-card h1{
margin-top:8px;
color:var(--c4);
}

/* nav */

.bottom-nav{
position:fixed;
bottom:14px;
left:50%;
transform:translateX(-50%);
background:white;
padding:14px;
border-radius:28px;
display:flex;
gap:12px;
box-shadow:0 8px 25px rgba(0,0,0,.08);
z-index:999;
animation:fadeUp .4s ease;
}

.bottom-nav button{
background:var(--c4);
color:white;
min-width:115px;
}

/* modal */

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.35);
display:none;
justify-content:center;
align-items:center;
z-index:99999;
backdrop-filter:blur(3px);
}

.modal-box{
background:white;
width:95%;
max-width:500px;
padding:30px;
border-radius:32px;
box-shadow:0 10px 30px rgba(0,0,0,.12);
max-height:90vh;
overflow:auto;
}

.setting-group{
margin-bottom:20px;
}

.setting-title{
font-size:1.1rem;
font-weight:600;
margin-bottom:12px;
color:var(--c4);
}

.upload-box{
background:var(--c1);
padding:14px;
border-radius:18px;
margin-bottom:14px;
}

.hidden{
display:none!important;
}

.footer{
text-align:center;
margin-top:14px;
font-size:.20rem;
color:#8d776a;
}

.date-box{
font-size:1.2rem;
font-weight:600;
margin-bottom:20px;
}

.status-toast{
position:fixed;
right:20px;
bottom:90px;
background:linear-gradient(135deg,var(--c4),var(--c3));
color:white;
padding:14px 20px;
border-radius:18px;
font-size:.95rem;
box-shadow:0 8px 20px rgba(0,0,0,.12);
z-index:99999;
opacity:0;
transform:translateY(30px);
transition:.35s;
pointer-events:none;
}

.status-toast.show{
opacity:1;
transform:translateY(0);
}

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@media(max-width:768px){

.banner-slider{
height:320px;
}

.logo h1{
font-size:1.5rem;
}

.bottom-nav{
width:95%;
}

.bottom-nav button{
min-width:auto;
flex:1;
font-size:.9rem;
padding:14px 10px;
}

}

</style>
</head>

<body>

<img id="bgPreview">
<div class="bg-overlay"></div>

<div class="status-toast" id="statusToast"></div>

<div class="container">

<div class="header">

<div class="logo">
<h1>ระบบเช็คชื่อเวรM5/1</h1>
</div>

<div class="top-actions hidden" id="topActions">
<button class="setting-btn" onclick="openSetting()">⚙️ ตั้งค่า</button>
<button class="logout-btn" onclick="logout()">🚪 ออกจากระบบ</button>
</div>

</div>

<div class="card login-card" id="loginPage">

<h2 style="margin-bottom:20px;font-size:2rem;">🔐 เข้าสู่ระบบ</h2>

<input type="text" id="username" placeholder="ชื่อผู้ใช้">

<input type="password" id="password" placeholder="รหัสผ่าน">

<button class="btn-main" style="width:100%;margin-bottom:10px;" onclick="loginTeacher()">
👩‍🏫 เข้าสู่ระบบครู
</button>

<button class="btn-soft" style="width:100%;" onclick="loginStudent()">
👨‍🎓 เข้าชมแบบนักเรียน
</button>

</div>

<div id="homePage" class="hidden">

<div class="banner-slider">
<div class="slides" id="slides"></div>
<div class="dots" id="dots"></div>
</div>

</div>

<div id="checkPage" class="hidden">

<div class="card">

<input type="text" id="searchInput" placeholder="ค้นหาชื่อ..." onkeyup="searchStudent()">

<div class="table-wrapper">

<table>

<thead>
<tr>
<th>เลขที่</th>
<th>รหัส</th>
<th>ชื่อ</th>
<th>เช็คชื่อ</th>
<th>ทำเวร</th>
</tr>
</thead>

<tbody id="studentTable"></tbody>

</table>

</div>

<button class="btn-main" style="width:100%;margin-top:14px;" onclick="saveData()">
💾 บันทึกวันนี้
</button>

</div>

</div>

<div id="dashboardPage" class="hidden">

<div class="card">

<div class="dashboard">

<div class="dash-card">
ทั้งหมด
<h1 id="allCount">0</h1>
</div>

<div class="dash-card">
มาเรียน
<h1 id="checkedCount">0</h1>
</div>

<div class="dash-card">
ทำเวร
<h1 id="doneCount">0</h1>
</div>

<div class="dash-card">
ขาด
<h1 id="absentCount">0</h1>
</div>

</div>

</div>

<div class="card">

<h2 style="margin-bottom:12px;">📈 สรุปรายเดือน</h2>

<canvas id="monthlyChart"></canvas>

</div>

</div>

<div id="historyPage" class="hidden">

<div class="card">

<div class="date-box" id="todayDate"></div>

<input type="date" id="historyDate" onchange="filterHistoryDate()">

<div class="table-wrapper">

<table>

<thead>
<tr>
<th>วัน/เดือน/ปี</th>
<th>เลขที่</th>
<th>ชื่อ</th>
<th>เช็คชื่อ</th>
<th>ทำเวร</th>
</tr>
</thead>

<tbody id="historyTable"></tbody>

</table>

</div>

</div>

</div>

</div>

<div class="bottom-nav hidden" id="bottomNav">

<button onclick="openPage('checkPage')">📝 เช็คชื่อ</button>

<button onclick="openPage('dashboardPage')">📊 Dashboard</button>

<button onclick="openPage('historyPage')">🕒 ย้อนหลัง</button>

<button onclick="goHome()">🏠 Home</button>

</div>

<!-- วางโค้ดนี้ไว้ก่อน <script> -->

<!-- SETTING -->

<div class="modal" id="settingModal">

<div class="modal-box">

<h2 style="margin-bottom:20px;">⚙️ ตั้งค่า</h2>

<div class="setting-group">

<div class="setting-title">🖼️ จัดการรูปสไลด์</div>

<div class="upload-box">
<h3 style="margin-bottom:10px;">รูปสไลด์ที่ 1</h3>
<input type="file" accept="image/*" onchange="changeSlide(event,0)">
</div>

<div class="upload-box">
<h3 style="margin-bottom:10px;">รูปสไลด์ที่ 2</h3>
<input type="file" accept="image/*" onchange="changeSlide(event,1)">
</div>

<div class="upload-box">
<h3 style="margin-bottom:10px;">รูปสไลด์ที่ 3</h3>
<input type="file" accept="image/*" onchange="changeSlide(event,2)">
</div>

</div>

<div class="setting-group">

<div class="setting-title">🌄 จัดการพื้นหลัง</div>

<div class="upload-box">
<h3 style="margin-bottom:10px;">เปลี่ยนรูปพื้นหลัง</h3>
<input type="file" accept="image/*" onchange="changeBackground(event)">
</div>

<div class="upload-box">
<button class="btn-danger" style="width:100%;" onclick="removeBackground()">
🗑️ ลบรูปพื้นหลัง
</button>
</div>

</div>

<div class="setting-group">

<div class="setting-title">📂 จัดการข้อมูล</div>

<div class="upload-box">
<button class="btn-danger" style="width:100%;" onclick="clearHistory()">
🗑️ ลบย้อนหลังทั้งหมด
</button>
</div>

</div>

<button class="btn-main" onclick="closeSetting()" style="width:100%;margin-bottom:10px;">
💾 บันทึก
</button>

<button class="btn-soft" onclick="closeSetting()" style="width:100%;">
ปิด
</button>

</div>

</div>

<!-- แทนที่ script เดิมทั้งหมดด้วยโค้ดนี้ -->

checked:false,

},

done:false
},

{

studentId:"08305",

checked:false,
done:false
},

{
no:20,
studentId:"08307",
name:"นางสาวนริญา ดีมา",
checked:false,
done:false
}

];

let isTeacher = false;
let monthlyChart;

/* slides */

let slideImages = JSON.parse(
localStorage.getItem("slideImages")
) || [

"https://images.unsplash.com/photo-1522202176988-66273c2fd55f?q=80&w=1200&auto=format&fit=crop",

"https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=1200&auto=format&fit=crop",

"https://images.unsplash.com/photo-1523240795612-9a054b0db644?q=80&w=1200&auto=format&fit=crop"

];

/* background */

function loadBackground(){

const bg = localStorage.getItem("customBackground");

const bgPreview =
document.getElementById("bgPreview");

if(bg){

bgPreview.src = bg;
bgPreview.style.display = "block";

}else{

bgPreview.style.display = "none";

}

}

loadBackground();

function changeBackground(event){

const file = event.target.files[0];

if(!file)return;

const reader = new FileReader();

reader.onload = function(e){

localStorage.setItem(
"customBackground",
e.target.result
);

loadBackground();

showStatus("เปลี่ยนพื้นหลังแล้ว ✨");

};

reader.readAsDataURL(file);

}

function removeBackground(){

localStorage.removeItem("customBackground");

loadBackground();

showStatus("ลบพื้นหลังแล้ว");

}

/* date */

function getThaiDate(){

const now = new Date();

const day =
String(now.getDate()).padStart(2,'0');

const month =
String(now.getMonth()+1).padStart(2,'0');

const year =
now.getFullYear()+543;

return `${day}/${month}/${year}`;

}

function setTodayDate(){

document.getElementById("todayDate")
.innerHTML = getThaiDate();

}

setTodayDate();

/* login */

function loginTeacher(){

const username =
document.getElementById("username").value;

const password =
document.getElementById("password").value;

if(
username === "teacher" &&
password === "1234"
){

isTeacher = true;

startSystem();

}else{

alert("ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง");

}

}

function loginStudent(){

isTeacher = false;

startSystem();

}

function logout(){

location.reload();

}

/* start */

function startSystem(){

document
.getElementById("loginPage")
.classList.add("hidden");

document
.getElementById("homePage")
.classList.remove("hidden");

document
.getElementById("bottomNav")
.classList.remove("hidden");

document
.getElementById("topActions")
.classList.remove("hidden");

renderStudentTable();

renderHistory();

renderChart();

updateDashboard();

showStatus("เข้าสู่ระบบสำเร็จ ✨");

}

/* pages */

function openPage(id){

document
.querySelectorAll(
"#homePage,#checkPage,#dashboardPage,#historyPage"
)
.forEach(page=>{

page.classList.add("hidden");

});

document
.getElementById(id)
.classList.remove("hidden");

}

function goHome(){

document
.querySelectorAll(
"#checkPage,#dashboardPage,#historyPage"
)
.forEach(page=>{

page.classList.add("hidden");

});

document
.getElementById("homePage")
.classList.remove("hidden");

}

/* slider */

function renderSlides(){

const slidesContainer =
document.getElementById("slides");

const dotsContainer =
document.getElementById("dots");

slidesContainer.innerHTML = "";
dotsContainer.innerHTML = "";

slideImages.forEach((img,index)=>{

slidesContainer.innerHTML += `
<div class="slide ${index===0?'active':''}">
<img src="${img}">
</div>
`;

dotsContainer.innerHTML += `
<div class="dot ${index===0?'active':''}"
onclick="showSlide(${index})"></div>
`;

});

}

renderSlides();

let currentSlide = 0;

function showSlide(index){

const slides =
document.querySelectorAll(".slide");

const dots =
document.querySelectorAll(".dot");

slides.forEach(slide=>{
slide.classList.remove("active");
});

dots.forEach(dot=>{
dot.classList.remove("active");
});

slides[index].classList.add("active");
dots[index].classList.add("active");

currentSlide = index;

}

setInterval(()=>{

const slides =
document.querySelectorAll(".slide");

currentSlide++;

if(currentSlide >= slides.length){
currentSlide = 0;
}

showSlide(currentSlide);

},4000);

/* change slide */

function changeSlide(event,index){

const file = event.target.files[0];

if(!file)return;

const reader = new FileReader();

reader.onload = function(e){

slideImages[index] = e.target.result;

localStorage.setItem(
"slideImages",
JSON.stringify(slideImages)
);

renderSlides();

showStatus("เปลี่ยนรูปสไลด์แล้ว ✨");

};

reader.readAsDataURL(file);

}

/* table */

function renderStudentTable(list = students){

const tbody =
document.getElementById("studentTable");

tbody.innerHTML = "";

list.forEach(student=>{

const realIndex =
students.indexOf(student);

tbody.innerHTML += `

<tr>

<td>${student.no}</td>

<td>${student.studentId}</td>

<td>${student.name}</td>

<td>

<button
class="${student.checked?'active-btn':''}"
onclick="toggleCheck(${realIndex})">

${student.checked?'✅ มา':'เช็คชื่อ'}

</button>

</td>

<td>

<button
class="${student.done?'active-btn':''}"
onclick="toggleDone(${realIndex})">

${student.done?'🧹 เสร็จ':'ทำเวร'}

</button>

</td>

</tr>

`;

});

}

/* check */

function toggleCheck(index){

if(!isTeacher)return;

students[index].checked =
!students[index].checked;

renderStudentTable();

updateDashboard();

}

function toggleDone(index){

if(!isTeacher)return;

students[index].done =
!students[index].done;

renderStudentTable();

updateDashboard();

}

/* dashboard */

function updateDashboard(){

const checked =
students.filter(
s=>s.checked
).length;

const done =
students.filter(
s=>s.done
).length;

document
.getElementById("allCount")
.innerHTML = students.length;

document
.getElementById("checkedCount")
.innerHTML = checked;

document
.getElementById("doneCount")
.innerHTML = done;

document
.getElementById("absentCount")
.innerHTML =
students.length - checked;

}

/* search */

function searchStudent(){

const keyword =

/* save */

function saveData(){

const today = getThaiDate();

const data = {

date: today,

timestamp: new Date().toLocaleTimeString("th-TH"),

students: students

};

/* บันทึกลง Google Sheet */

fetch(
"https://script.google.com/macros/s/AKfycbymN8NlsKnK6gqpD4AAAul5hz_chhKOB788exetLJMXop6hzQqgnCcaCXFcc0u-9KgeSQ/exec?data="
+ encodeURIComponent(JSON.stringify(data))
)

.then(res => res.text())

.then(result => {

console.log(result);

showStatus("บันทึกข้อมูลลงชีทแล้ว 💾");

})

.catch(err => {

console.log(err);

showStatus("เกิดข้อผิดพลาด ❌");

});

/* บันทึกลง localStorage */

let history =
JSON.parse(
localStorage.getItem("dutyHistory")
) || [];

students.forEach(student=>{

history.push({

date: today,

no: student.no,

name: student.name,

checked: student.checked,

done: student.done

});

});

localStorage.setItem(
"dutyHistory",
JSON.stringify(history)
);

renderHistory();

renderChart();

}

/* history */

function renderHistory(){

const history =
JSON.parse(
localStorage.getItem("dutyHistory")
)||[];

const tbody =
document.getElementById("historyTable");

tbody.innerHTML = "";

if(history.length===0){

tbody.innerHTML = `
<tr>
<td colspan="5">ไม่มีข้อมูล</td>
</tr>
`;

return;

}

history
.slice()
.reverse()
.forEach(item=>{

tbody.innerHTML += `

<tr>

<td>${item.date}</td>

<td>${item.no}</td>

<td>${item.name}</td>

<td>${item.checked?'✅':'❌'}</td>

<td>${item.done?'🧹':'-'}</td>

</tr>

`;

});

}

/* filter */

function filterHistoryDate(){

const selected =
document
.getElementById("historyDate")
.value;

const history =
JSON.parse(
localStorage.getItem("dutyHistory")
)||[];

const tbody =
document.getElementById("historyTable");

tbody.innerHTML = "";

history.forEach(item=>{

const parts =
item.date.split("/");

const year =
parseInt(parts[2]) - 543;

const thaiDate =
`${year}-${parts[1]}-${parts[0]}`;

if(thaiDate === selected){

tbody.innerHTML += `

<tr>

<td>${item.date}</td>

<td>${item.no}</td>

<td>${item.name}</td>

<td>${item.checked?'✅':'❌'}</td>

<td>${item.done?'🧹':'-'}</td>

</tr>

`;

}

});

}

/* delete */

function clearHistory(){

const confirmDelete =
confirm("ลบข้อมูลย้อนหลังทั้งหมด ?");

if(!confirmDelete)return;

localStorage.removeItem("dutyHistory");

renderHistory();

renderChart();

showStatus("ลบข้อมูลย้อนหลังแล้ว");

}

/* chart */

function renderChart(){

const history =
JSON.parse(
localStorage.getItem("dutyHistory")
)||[];

const monthData = {};

history.forEach(item=>{

const parts =
item.date.split("/");

const month =
`${parts[1]}/${parts[2]}`;

if(!monthData[month]){

monthData[month] = {
checked:0,
done:0
};

}

if(item.checked){
monthData[month].checked++;
}

if(item.done){
monthData[month].done++;
}

});

const labels =
Object.keys(monthData);

const checkedData =
labels.map(
m=>monthData[m].checked
);

const doneData =
labels.map(
m=>monthData[m].done
);

const ctx =
document
.getElementById("monthlyChart")
.getContext("2d");

if(monthlyChart){
monthlyChart.destroy();
}

monthlyChart = new Chart(ctx,{

type:"bar",

data:{

labels:labels,

datasets:[

{
label:"มาเรียน",
data:checkedData,
backgroundColor:"#D9A299"
},

{
label:"ทำเวร",
data:doneData,
backgroundColor:"#DCC5B2"
}

]

},

options:{
responsive:true
}

});

}

/* status popup */

function showStatus(text){

let old =
document.getElementById("statusPopup");

if(old){
old.remove();
}

const popup =
document.createElement("div");

popup.id = "statusPopup";

popup.innerHTML = text;

popup.style.position = "fixed";
popup.style.right = "18px";
popup.style.bottom = "90px";
popup.style.background = "#D9A299";
popup.style.color = "white";
popup.style.padding = "14px 18px";
popup.style.borderRadius = "18px";
popup.style.boxShadow =
"0 8px 20px rgba(0,0,0,.15)";
popup.style.zIndex = "999999";
popup.style.animation = "fadeIn .3s";

document.body.appendChild(popup);

setTimeout(()=>{

popup.style.opacity = "0";

setTimeout(()=>{
popup.remove();
},300);

},2000);

}
