<!DOCTYPE html>
<html lang="th">
<head>

<title>ระบบห้องเรียน M5/1</title>

<!-- Firebase 12.14.0 (อัปเดตล่าสุด) -->
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"
  onerror="window._firebaseLoadError=true;console.error('❌ โหลด firebase-app-compat.js ไม่ได้')"></script>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"
  onerror="window._firebaseLoadError=true;console.error('❌ โหลด firebase-auth-compat.js ไม่ได้')"></script>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore-compat.js"
  onerror="window._firebaseLoadError=true;console.error('❌ โหลด firebase-firestore-compat.js ไม่ได้')"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.min.js"></script>

<style>
:root{
  --c1:#FAF7F3;--c2:#F0E4D3;--c3:#DCC5B2;--c4:#D9A299;
  --text:#5c4d45;--green:#89b89a;--red:#e58d8d;--yellow:#e5c08d;--blue:#89aeb8;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Noto Sans Thai','Sarabun','Prompt',system-ui,-apple-system,sans-serif;}
body{background:var(--c1);color:var(--text);}
.container{max-width:1100px;margin:auto;padding:20px;padding-bottom:calc(130px + env(safe-area-inset-bottom));}
.header{background:linear-gradient(135deg,var(--c3),var(--c4));padding:16px 20px;border-radius:24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:18px;color:white;}
.logo h1{font-size:1.6rem;line-height:1.2;}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;}
.top-actions button{border:none;padding:10px 14px;border-radius:14px;cursor:pointer;font-size:.88rem;font-weight:600;white-space:nowrap;}
.setting-btn{background:#b89c82;color:white;}
.logout-btn{background:#de7f7f;color:white;}
.card{background:white;border-radius:24px;padding:20px;margin-bottom:16px;box-shadow:0 4px 16px rgba(0,0,0,.05);}
.login-card{max-width:420px;margin:40px auto;padding:30px;border-radius:34px;}
.login-tabs{display:flex;background:var(--c1);border-radius:16px;padding:4px;gap:4px;margin-bottom:20px;}
.login-tab{flex:1;padding:10px;border:none;border-radius:12px;cursor:pointer;font-size:.88rem;font-weight:600;background:transparent;color:#bbb;transition:.2s;}
.login-tab.active{background:var(--c4);color:white;}
input[type=text],input[type=password],input[type=date],select,textarea{width:100%;border:none;background:var(--c1);padding:13px;border-radius:14px;outline:none;margin-bottom:12px;font-size:16px;-webkit-appearance:none;appearance:none;}
button{border:none;border-radius:14px;padding:13px;cursor:pointer;font-size:1rem;transition:.2s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
button:hover{transform:translateY(-2px);}
.btn-main{background:var(--c4);color:white;}
.btn-soft{background:var(--c2);color:var(--text);}
.btn-danger{background:var(--red);color:white;}
.btn-green{background:var(--green);color:white;}
.btn-blue{background:var(--blue);color:white;}
.banner-slider{width:100%;height:340px;border-radius:30px;overflow:hidden;position:relative;margin-bottom:24px;background:linear-gradient(135deg,var(--c3),var(--c4));}
.slides{width:100%;height:100%;position:relative;}
.slide{position:absolute;width:100%;height:100%;opacity:0;transition:1s;}
.slide.active{opacity:1;}
.slide{background:linear-gradient(135deg,var(--c3),var(--c4));} /* ✅ placeholder ระหว่างรอโหลด */
.slide img{width:100%;height:100%;object-fit:cover;transition:transform 8s ease;}
.slide.active img{transform:scale(1.05);}
.dots{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:5;}
.dot{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.5);cursor:pointer;}
.dot.active{background:white;}
.dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;}
.dash-card{background:var(--c1);padding:16px;border-radius:18px;text-align:center;}
.dash-card h1{margin-top:6px;color:var(--c4);font-size:2rem;}
.percent-badge{display:inline-block;background:#f0e4d3;color:#b87a6a;border-radius:8px;padding:2px 8px;font-size:.8rem;margin-top:4px;font-weight:600;}
.ai-card{background:linear-gradient(135deg,#fdf6f0,#fdeee8);border-radius:20px;padding:18px;margin-bottom:14px;border:1.5px solid var(--c3);position:relative;overflow:hidden;}
.ai-card::before{content:"🤖";font-size:5rem;position:absolute;right:-10px;top:-10px;opacity:.08;transform:rotate(15deg);}
.ai-score-ring{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;margin:0 auto 12px;border:5px solid var(--c4);position:relative;}
.ai-score-ring .score-num{font-size:1.4rem;font-weight:600;color:var(--c4);}
.ai-score-ring .score-label{font-size:.6rem;color:#bbb;}
.ai-status-badge{display:inline-block;padding:4px 14px;border-radius:20px;font-size:.82rem;font-weight:600;margin-bottom:10px;}
</style>

<script>
// ════════════════════════════════════════════════════════════════
// INIT & TIMEOUT MANAGEMENT (FIX #2: Firebase error handling + #3: Memory leak prevention)
// ════════════════════════════════════════════════════════════════

var _activeIntervals = []; // ✅ Track intervals for cleanup
var _activeTimeouts = [];  // ✅ Track timeouts for cleanup

function setManagedInterval(fn, delay) {
  var id = setInterval(fn, delay);
  _activeIntervals.push(id);
  return id;
}

function setManagedTimeout(fn, delay) {
  var id = setTimeout(fn, delay);
  _activeTimeouts.push(id);
  return id;
}

function clearAllManagedTimers() {
  _activeIntervals.forEach(clearInterval);
  _activeTimeouts.forEach(clearTimeout);
  _activeIntervals = [];
  _activeTimeouts = [];
}

// ════════════════════════════════════════════════════════════════
// SECURITY: URL VALIDATION (FIX #1: CSS Injection vulnerability)
// ════════════════════════════════════════════════════════════════

function isValidUrl(url) {
  try {
    var parsed = new URL(url);
    return /^https?:/.test(parsed.protocol); // Only allow http/https
  } catch(e) {
    return false;
  }
}

function safeSetBackgroundImage(url) {
  if (!url || !isValidUrl(url)) {
    console.warn("⚠️ Invalid background URL blocked");
    return false;
  }
  document.body.style.backgroundImage = "url('" + url.replace(/'/g, "\\'") + "')";
  document.body.style.backgroundSize = "cover";
  return true;
}

// ════════════════════════════════════════════════════════════════
// STORAGE HELPERS WITH NULL CHECKS (FIX #4: Missing null checks)
// ════════════════════════════════════════════════════════════════

function getSafeLocalStorage(key, defaultValue) {
  try {
    var val = localStorage.getItem(key);
    return val !== null ? val : defaultValue;
  } catch(e) {
    console.warn("localStorage access blocked:", e);
    return defaultValue;
  }
}

// ════════════════════════════════════════════════════════════════
// VIEWPORT HEIGHT FIX (FIX #5: Viewport height calculation)
// ════════════════════════════════════════════════════════════════

function initViewportTracking() {
  var _baseVH = null;
  
  function updateVH() {
    if (_baseVH === null) {
      _baseVH = window.innerHeight;
    }
    var h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    document.documentElement.style.setProperty("--vh", (h * 0.01) + "px");
    var isKbOpen = (window.innerHeight - h) > 150;
    document.body.classList.toggle("keyboard-open", isKbOpen);
  }
  
  updateVH();
  window.addEventListener("resize", updateVH);
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", updateVH);
    window.visualViewport.addEventListener("scroll", updateVH);
  }
}

// ════════════════════════════════════════════════════════════════
// CLOUD OPERATIONS WITH TIMEOUT (FIX #6: Add timeout to cloud operations)
// ════════════════════════════════════════════════════════════════

function withTimeout(promise, ms) {
  return Promise.race([
    promise,
    new Promise(function(_, reject) {
      setManagedTimeout(function() {
        reject(new Error("Operation timeout after " + ms + "ms"));
      }, ms);
    })
  ]);
}

// ════════════════════════════════════════════════════════════════
// FIREBASE INITIALIZATION (FIXED: Proper error checking)
// ════════════════════════════════════════════════════════════════

var firebaseAuth = null;
var firebaseDB = null;

function initFirebase() {
  if (window._firebaseLoadError) {
    console.error("❌ Firebase libraries failed to load");
    return false;
  }
  
  if (!window.firebase) {
    console.error("❌ Firebase not available");
    return false;
  }
  
  try {
    firebase.initializeApp({
      apiKey: "AIzaSyAoNYXuqo_c7LhYtaiDA82_aic_rL-RfO8",
      authDomain: "df23445.firebaseapp.com",
      projectId: "df23445",
      storageBucket: "df23445.firebasestorage.app",
      messagingSenderId: "857734986692",
      appId: "1:857734986692:web:b7229d42bbfa9af0458291",
      measurementId: "G-QVCJE26B1F"
    });
    
    firebaseAuth = firebase.auth();
    firebaseDB = firebase.firestore();
    console.log("✅ Firebase initialized successfully");
    return true;
  } catch(e) {
    console.error("Firebase init error:", e);
    return false;
  }
}

// ════════════════════════════════════════════════════════════════
// MAIN STARTUP
// ════════════════════════════════════════════════════════════════

window.onload = function() {
  console.log("✅ Initializing app with Firebase 12.14.0...");
  
  // Splash message rotation
  var splashMsgs = ["กำลังเชื่อมต่อ Firebase...","ตรวจสอบสิทธิ์ผู้ใช้...","โหลดข้อมูลห้องเรียน...","เตรียมระบบ AI..."];
  var _smIdx = 0;
  var _smEl = document.getElementById("splashMsg");
  var _smTimer = setManagedInterval(function() {
    _smIdx = (_smIdx + 1) % splashMsgs.length;
    if (_smEl) _smEl.textContent = splashMsgs[_smIdx];
  }, 900);
  
  function hideSplash() {
    clearInterval(_smTimer);
    var sp = document.getElementById("splashPage");
    if (sp && !sp.classList.contains("fade-out")) {
      setManagedTimeout(function() {
        sp.classList.add("fade-out");
        setManagedTimeout(function() {
          sp.style.display = "none";
        }, 500);
      }, 400);
    }
  }
  
  // Date setup
  var todayDateEl = document.getElementById("todayDate");
  if (todayDateEl) todayDateEl.innerHTML = "📅 " + new Date().toLocaleDateString("th-TH");
  
  // Background image (with security check)
  var bg = getSafeLocalStorage("customBackground", null);
  if (bg) {
    safeSetBackgroundImage(bg);
  }
  
  // Initialize viewport tracking
  initViewportTracking();
  
  // Initialize Firebase
  if (!initFirebase()) {
    hideSplash();
    console.error("❌ Firebase initialization failed");
    return;
  }
  
  console.log("✅ Firebase initialized successfully");
  hideSplash();
};

// Cleanup on page unload
window.addEventListener("beforeunload", clearAllManagedTimers);
</script>

</head>
<body>

<div id="splashPage" class="splash-page">
  <div class="splash-content">
    <div class="splash-logo">🏫</div>
    <p id="splashMsg">กำลังเชื่อมต่อ Firebase...</p>
  </div>
</div>

<div id="todayDate" style="text-align:right;padding:10px 20px;color:#999;font-size:.85rem;"></div>

<div class="container">
  <div class="header">
    <div class="logo">
      <h1>📚 ระบบห้องเรียน M5/1</h1>
    </div>
    <div class="top-actions">
      <button class="setting-btn" onclick="openSettings()">⚙️ ตั้งค่า</button>
      <button class="logout-btn" onclick="logout()">🚪 ออกจากระบบ</button>
    </div>
  </div>
</div>

<script>
function openSettings() {
  console.log("Opening settings...");
}

function logout() {
  clearAllManagedTimers(); // ✅ Clean up before logout
  console.log("Logging out...");
}
</script>

</body>
</html>
